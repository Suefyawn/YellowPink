<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <clipPath id="cy">
      <circle cx="12" cy="16" r="11"/>
    </clipPath>
    <clipPath id="cp">
      <circle cx="20" cy="16" r="11"/>
    </clipPath>
  </defs>
  <!-- Background -->
  <rect width="32" height="32" rx="8" fill="#fff"/>
  <!-- Yellow circle -->
  <circle cx="12" cy="16" r="11" fill="#F7C948"/>
  <!-- Pink circle (semi-transparent overlap via clip) -->
  <circle cx="20" cy="16" r="11" fill="#E8487F" opacity="0.92"/>
  <!-- Overlap blend: yellow tint over pink -->
  <circle cx="12" cy="16" r="11" fill="#F7C948" opacity="0.35" clip-path="url(#cp)"/>
</svg>
